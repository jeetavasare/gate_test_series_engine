		function showId() {
			if (mockVar.storeCandResponse == 1 || isOfflineIBA)
				maintainReadyAudit();
			var url = document.URL;
			var orgId = "";
			var mockId = "";
			var attemptId = "";
			var candMasterId = "";
			var authenticationKey = "";
			if (url.indexOf("instructions.html?") >= 0) {
				var params = url.split("instructions.html?");
				orgId = $.trim(params[1]).split("@@")[0];
				mockId = $.trim(params[1]).split("@@")[1];
				attemptId = $.trim(params[1]).split("@@")[2];
				candMasterId = "";
				authenticationKey = $.trim(params[1]).split("@@")[5];
				if (mockVar.storeCandResponse == 1) {
					candMasterId = $.trim(params[1]).split("@@")[3];
					if (candMasterId != undefined && candMasterId.indexOf("#") > -1) {
						candMasterId = candMasterId.substring(0, candMasterId.indexOf("#"));
					}
				}
				if (typeof (attemptId) != 'undefined' && attemptId.indexOf("#") > -1) {
					attemptId = attemptId.substring(0, attemptId.indexOf("#"));
				}
				if (typeof (mockId) != 'undefined' && mockId.indexOf("#") > -1) {
					mockId = mockId.substring(0, mockId.indexOf("#"));
				}

				if (typeof (authenticationKey) != 'undefined' && authenticationKey.indexOf("#") > -1) {
					authenticationKey = authenticationKey.substring(0, authenticationKey.indexOf("#"));
				}
			} else {
				mockId = $.cookie("assessmentId") == undefined ? sessionStorage.assessmentId : $.cookie("assessmentId");
			}
			isAuthenticationRequired = false;
			if (mockId != undefined ? (mockId.indexOf("M") >= 0) : false) {
				announcePageLoading("Remote Assessment Page");
				//window.location.href="quiz.html?"+orgId+"@@"+mockId+"@@"+attemptId+"@@"+candMasterId+"@@"+0+"@@"+authenticationKey;

				}

				else
					setTimeout(function () { window.location.href = "quiz.html?" + orgId + "@@" + mockId + "@@0@@0@@0@@0"; }, 50);


			}
			else {
				announcePageLoading("Remote Assessment Page");

					setTimeout(function () { window.location.href = document.URL.replace("instructions", "quiz"); }, 50);


				else

			//window.location.href="quiz.html?"+orgId+"@@"+mockId+"@@"+attemptId+"@@"+candMasterId+"@@"+0;

		function newReadyToBegin() {
			var check;
			var orgId = sessionStorage.orgId;
			var assessmentId = sessionStorage.assessmentId;
			var attemptIds = sessionStorage.attemptId;
			var candMasterId = sessionStorage.cand_master_id;
			var assessmentIndex = sessionStorage.assessmentIndex;
			var isOnlineCheck = sessionStorage.isofflineOnline;
			if (isOnlineCheck == "1") {
				if (document.getElementById('isOfflineOnline').value == "YES") {
					check = 1;
				}
				else if (document.getElementById('isOfflineOnline').value == "NO") {
					check = 0;
				}
				sessionStorage.isofflineOnlineSelected = check;
				if (check == 1 || check == 0) {
					var URL = "/IBA/IBAFiles.do?action=saveIsOfflineOnline&orgId=" + orgId + "&assessmentId=" + assessmentId + "&attemptIds=" + attemptIds + "&candMasterId=" + candMasterId + "&assessmentIndex" + assessmentIndex + "&check=" + check;
					$.ajax({
						url: URL,
						type: 'POST',
						data: 'text',
						async: false,
						success: function (data) {
							if (data == 'success' || data == 'failure') {
								readyToBegin();
							}
						}
					});
				}
			}
			else {
				readyToBegin();
			}

		}


		function readyToBegin(timeout) {
			if (sessionStorage.assessmentMode == "2") caches.delete(cacheName).then(function () { console.log("cache deleted!!"); }).catch(function () { console.log("Failed to delete cache"); });
			if (document.getElementById("defaultLanguage").options.length > 2) {
				var lang = document.getElementById("defaultLanguage");
				if (lang.value != '0') {
					createDefaultSubject(lang.value);
				} else if (timeout) {
					createDefaultSubject(document.getElementById("defaultLanguage").options[1].value);
				} else {
					cnfPop('InfoPopup');
					//trapFocusinInfo();
					// $("#infoMsg2").html("Please choose your default language.");
					$("#infoMsg2").text(mockLabels.chooseDefaultLangErr);
					return false;
				}
			} else {
				try {
					createDefaultSubject(document.getElementById("defaultLanguage").options[1].value);
				} catch (e) {

				}
			}
			if (document.getElementById("disclaimer").checked == true || sessionStorage.userDefinedNum === "schoolUI") {
				document.getElementById("readylink").removeAttribute("disabled", 0);
				showId();
			} else {
				cnfPop('InfoPopup');
				//trapFocusinInfo();
				//$("#infoMsg2").html('Please accept terms and conditions before proceeding.');
				$("#infoMsg2").text(mockLabels.acceptDisclaimerMessage);
				document.getElementById("readylink").disabled = "disabled";
				//$("#readylinkButton").attr("role","link");
				//$("#readylinkButton").attr("tabindex","-1");
				//$("#readylink").attr("role","presentation");
				$("#readylink").attr("tabindex", "-1");
				return false;
			}
		}

		function linkDisp() {
			if (document.getElementById("disclaimer").checked == true || sessionStorage.userDefinedNum === "schoolUI") {
				document.getElementById("readylink").removeAttribute("disabled", 0);
				$("#readylink").attr("aria-disabled", "false");
				//$("#readylink").attr("tabindex","0").attr("role","link");
				$("#readylink").attr("tabindex", "0");
			} else {
				document.getElementById("readylink").disabled = "disabled";
				$("#readylink").attr("disabled", "disabled");
				$("#readylink").attr("aria-disabled", "true");
				$("#readylink").attr("tabindex", "-1");
			}
		}

		$(document).on('click', '.pop-up-close-triggerfull', function () {

				$(document).on('click', '.pop-up-close-triggerfull', function () {
					alert("Safari browser detected");

			$("#footer").removeClass("fullzoom");

			/* To exit Full Screen */
			if (document.exitFullscreen) {
				document.exitFullscreen();
			} else if (document.webkitExitFullscreen) {
				document.webkitExitFullscreen();
			} else if (document.mozCancelFullScreen) {
				document.mozCancelFullScreen();
			} else if (document.msExitFullscreen) {
				document.msExitFullscreen();
			} else {
				var shell = new ActiveXObject("WScript.Shell");
				shell.SendKeys("{F11}");
			}
			$(".maximizeicon").show();
			resetCarousel();
			$(".connected-carousels .carousel li img").removeClass("fullzoomimg");
		});
		$(document).ready(function () {
			var btn = document.getElementsByClassName('maximizeicon');
			$('.maximizeicon').on('click', function () {
				var isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
				var isSafari = /Safari/.test(navigator.userAgent) && /Apple Computer/.test(navigator.vendor);
				if (isSafari) {
					$('.pop-up-close-triggerfull').css('visibility', 'hidden');

					$('.navigation').css('visibility', 'hidden');
					$('.prev').css('margin-left', '-20px');
					$('.next').css('margin-right', '-20px');
					if ($(window).width() < 769) {
						$('.connected-carousels ul li img').height(auto);
					}
					if ($(window).width() < 381) {
						$('.connected-carousels img').height(auto);
					}
				}
			});
			if (document.addEventListener) {
				document.addEventListener('webkitfullscreenchange', exitHandler, false);
				document.addEventListener('mozfullscreenchange', exitHandler, false);
				document.addEventListener('fullscreenchange', exitHandler, false);
				document.addEventListener('MSFullscreenChange', exitHandler, false);
			}
		});
		function exitHandler() {
			if (document.webkitIsFullScreen === false) {
				resetCarousel();
			}
			else if (document.mozFullScreen === false) {
				resetCarousel();
			}
			else if (document.msFullscreenElement === false) {
				resetCarousel();
			}
		}

		function readSysInstructionsXMLInstPage(xml, orgId, mockId) {

						if (mockVar.storeCandResponse == 1 || (mockId != undefined && mockId.indexOf("MOA") != -1)) {
							disclaimerContent = $.trim($(this).find("DISCLAIMERTEXTOA").text());
						}
						else {
							disclaimerContent = $.trim($(this).find("DISCLAIMERTEXT").text());
						}
						var subjectInstructionsDetails = sessionStorage.SubjectLevelInstructions == "YES" && sessionStorage.subjectId != undefined && sessionStorage.subjectId != "0" ? sessionStorage.subjectId + "_" : "";
						if (disclaimerContent == "")
							xmlForDisclaimer = readAndReturnXML(subjectInstructionsDetails + 'custInstructions.xml' + '?v=' + sessionStorage.assessmentUpdatedDate, true);
					});
				} else {
					var cdnPath = (typeof (sessionStorage.cdnPath) != "undefined" && sessionStorage.cdnPath != "") ? sessionStorage.cdnPath + "/" : "";
					if (typeof (sessionStorage.xmlFilePath) != "undefined")
						xmlFilePath = sessionStorage.xmlFilePath;
					var subjectInstructionsDetails = sessionStorage.SubjectLevelInstructions == "YES" && sessionStorage.subjectId != undefined && sessionStorage.subjectId != "0" ? sessionStorage.subjectId + "_" : "";

					if (!isProofReadingMock && !isOfflineIBA)
						var xmlForDisclaimer = readAndReturnXML(cdnPath + xmlFilePath + '/' + subjectInstructionsDetails + 'custInstructions.xml' + '?v=' + sessionStorage.assessmentUpdatedDate, true);
					else if (isProofReadingMock)
						var xmlForDisclaimer = readAndReturnXML('proofReadingCustInstructions.xml', true);
					else if (isOfflineIBA)
						var xmlForDisclaimer = readAndReturnXML(sessionStorage.offlineIBAConfigPath + '/' + subjectInstructionsDetails + 'custInstructions.xml' + '?v=' + sessionStorage.assessmentUpdatedDate, true);
					else {
						//Do Nothing
					}
				}
				parseSysInstructions('inst', xml, useSystemInstructions.toUpperCase(), orgId, mockId, isOptionalSectionsAvailable.toUpperCase(), isMarkedForReviewConsidered.toUpperCase(), QPxml, xmlForDisclaimer, useDisclaimerInstructions, isInterruptionsAllowed);

				if ($('#iframeId').contents().find('#basInst option:selected').val().indexOf('sysInstText') > -1)
					langId = $('#iframeId').contents().find('#basInst option:selected').val().split('sysInstText')[1];

					formVoiceOverTextForInstruPageHtml(langId);

				$('.cusInstText' + langId).show();

					$('#pWait').hide();
				}, 1000);
				setTimeout(function () {
					//$('#container').removeAttr("aria-hidden");
					//$('#container').focus();
				}, 1000);
				if (mockVar.storeCandResponse == 1) {
					$('#iframeId').contents().find("#secondPageLangView").hide();
					if (!($('#secondPagep1 .cusInstText' + langId).text() == "The instructions are not available in the chosen language. ")) {
						$('#secondPagep1').show();
						$('#otherImpInstru').show();
					}
					else {
						$('#secondPagep1').hide();
						$('#otherImpInstru').hide();
					}
				}
				instructionTimer();


			}

			function instructionTimer() {
				mockVar.minInstruTime = sessionStorage.mininstrutime != undefined && sessionStorage.mininstrutime != -1 ? parseInt(sessionStorage.mininstrutime) * 60 : -1;
				mockVar.maxInstruTime = sessionStorage.maxinstrutime != undefined && sessionStorage.maxinstrutime != -1 ? parseInt(sessionStorage.maxinstrutime) * 60 : -1;
				mockVar.considerTime = sessionStorage.consider_instru_time != undefined ? sessionStorage.consider_instru_time : "NA";
				mockVar.attemptTime = typeof (sessionStorage.startTime) != "undefined" ? sessionStorage.startTime : "NA";
				mockVar.assessmentTime = typeof (sessionStorage.assessmentStartDate) != "undefined" ? sessionStorage.assessmentStartDate : "NA"
				var waitingTime = typeof (sessionStorage.waitingTime) != "NA" && sessionStorage.waitingTime != -1 ? sessionStorage.waitingTime : "NA";
				if (mockVar.maxInstruTime != -1) {
					if (mockVar.minInstruTime == -1)
						mockVar.minInstruTime = 0;
					if (mockVar.considerTime == "YES") {
						var date = new Date(mockVar.attemptTime);//15:06
						var date1 = new Date(mockVar.assessmentTime);// 15:00
						//startInstruCounter(mockVar.maxInstruTime - (date.getTime()-date1.getTime())/1000)
						var dt = new Date();
						if (sessionStorage.selectedGroupIds != "NA" && sessionStorage.mandateGroupUniformLaunch == 1 && waitingTime != "NA") {
							var date2 = new Date(waitingTime);//15:05
							dt.setSeconds(dt.getSeconds() + (mockVar.maxInstruTime - (date.getTime() - date2.getTime()) / 1000));
						}
						else {
							dt.setSeconds(dt.getSeconds() + (mockVar.maxInstruTime - (date.getTime() - date1.getTime()) / 1000));
						}
						initializeClock(dt);
					}
					else if (mockVar.considerTime == "NO") {
						//startInstruCounter(mockVar.maxInstruTime);
						var dt = new Date();
						dt.setSeconds(dt.getSeconds() + (mockVar.maxInstruTime));
						initializeClock(dt);
					}
				} else {
					$('.instruTimeCountDiv').hide();
					$("#mobileTimer").hide();
				}
			}
			function startInstruCounter(time) {
				$(".instruTimeCounter").html("<b>" + mockLabels.timeLeft + "<span>" + convertTime(time) + " " + timerFormatLabel + "</span></b>");
				$("#mobileTimer").html("<b>" + mockLabels.timeLeft + "<span>" + convertTime(time) + " " + timerFormatLabel + "</span></b>");
				if (time > 0) {
					if (mockVar.maxInstruTime - time > mockVar.minInstruTime) {
						$('#disclaimer').removeAttr("disabled");
						$('#disclaimer').removeAttr("title");
						$('#checkBoxEnableMessage').hide();
					} else {
						$('#disclaimer').attr('disabled', true);
						$('#disclaimer').attr('title', mockLabels.checkBoxEnableTitleMessage + convertTime(parseInt(mockVar.minInstruTime - (mockVar.maxInstruTime - time))) + " " + timerFormatLabel);
						$('#readylink').attr('title', mockLabels.checkBoxEnableTitleMessage + convertTime(parseInt(mockVar.minInstruTime - (mockVar.maxInstruTime - time))) + " " + timerFormatLabel);
						$('#agreementMessageDef').attr('title', mockLabels.checkBoxEnableTitleMessage + convertTime(parseInt(mockVar.minInstruTime - (mockVar.maxInstruTime - time))) + " " + timerFormatLabel);
						$('#agreementMessageCustom').attr('title', mockLabels.checkBoxEnableTitleMessage + convertTime(parseInt(mockVar.minInstruTime - (mockVar.maxInstruTime - time))) + " " + timerFormatLabel);
						$('#checkBoxEnableTime').html(convertTime(parseInt(mockVar.minInstruTime - (mockVar.maxInstruTime - time))) + " " + mockVar.timeFormat);
						if (mockVar.minInstruTime != 0)
							$('#checkBoxEnableMessage').show();
					}
					mockVar.instTimeCounter = setTimeout(function () { startInstruCounter(time - 1); }, 1000);
				} else {
					clearTimeout(mockVar.instTimeCounter);
					if (mockVar.maxInstruTime > 0) {
						document.getElementById("disclaimer").checked = true;
						readyToBegin(true);
					}
				}
			}
			window.onbeforeunload = function (event) {
				var url = document.URL;
				if (url.indexOf("instructions.html") >= 0 && isAuthenticationRequired)
					authenticationFileDeleted();
			};
		}

	</script>
</head>
