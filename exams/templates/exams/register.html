{% extends 'exams/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm mt-5">
            <h3 class="text-center mb-4">Register</h3>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Full Name</label>
                    <input type="text" name="full_name" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-custom w-100 mb-3" style="background-color: #28a745;">Create Account</button>
                <div class="text-center">
                    <span class="text-muted">Already have an account?</span> <a href="{% url 'login' %}" class="text-info text-decoration-none">Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
