{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block page_title %}{%endblock%}</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    <script>
        (() => {
            const updateTheme = () => {
                const theme = window.localStorage.getItem("theme") || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-bs-theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            };
            updateTheme();
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
        })();
    </script>
    <script src="{% static 'js/exam_session_checker.js' %}"></script>

    {% block head_css %}{% endblock %}
    {% block head_js %}{% endblock %}
</head>

<body>
    <nav class="p-2 top-nav rounded-bottom border-bottom" style="background-color: var(--card-bg);" >
        <div class="container d-flex justify-content-between align-items-center">
            <span class="d-flex align-items-center">
                <h2 class="me-3 mb-0"><a href="{% url 'home' %}" class="text-decoration-none">🛖</a></h2>
                <h4 class="mb-0">Welcome, {{ request.user.full_name|default:"User" }}</h4>
            </span>
            <div class="d-flex gap-2 justify-content-around">
                <span class="fs-4" style="cursor: pointer;" id="theme_toggle">☀️</span>
                <a href="{% url 'logout' %}" class="btn-custom btn-danger-custom">Logout</a>
            </div>
        </div>
    </nav>
    <div class="mt-3">
        {% block content %}{% endblock %}
    </div>
    {% block end_js %}{% endblock %}
    <script>
        document.getElementById('theme_toggle').addEventListener('click', function () {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';

            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            const newEmoji = newTheme === 'dark' ? '☀️' : '🌑';

            html.setAttribute('data-bs-theme', newTheme);
            html.setAttribute('data-theme', newTheme);

            this.innerText = newEmoji;
            localStorage.setItem('theme', newTheme);
        });
        <!-- Init Theme button -->
        let theme = document.documentElement.getAttribute('data-theme') || 'dark'
        document.getElementById("theme_toggle").innerText = theme == 'dark' ? '☀️' : '🌑'
    </script>
</body>

</html>
